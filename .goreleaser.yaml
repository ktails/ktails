version: 2

project_name: ktails

before:
  hooks:
    - go mod tidy

builds:
  - id: ktails
    main: ./cmd/page-client
    binary: ktails
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: ktails
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: ktails
    name: ktails
  draft: false
  prerelease: auto

homebrew_casks:
  - name: ktails
    repository:
      owner: ktails
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ktails/ktails"
    description: "A terminal-based Kubernetes resource browser built with Go and Bubble Tea"
    license: "GPL-3.0"
    binaries:
      - ktails
